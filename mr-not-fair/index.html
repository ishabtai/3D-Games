<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b211c">
<title>Mr. Not Fair: The Biscuit Tin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2b211c;overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;display:block;cursor:pointer}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#f6ead0;z-index:5}
#rot svg{width:120px;height:120px;animation:r 2s ease-in-out infinite}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot"><svg viewBox="0 0 100 100" aria-label="Turn your device sideways"><rect x="30" y="10" width="40" height="80" rx="8" fill="#f6b820" stroke="#2b2220" stroke-width="5"/><circle cx="50" cy="80" r="4" fill="#2b2220"/></svg></div>
<script>
'use strict';
/* Mr. Not Fair: The Biscuit Tin
   A no-reading episode for ages 4-7. The player makes a rule with picture cards,
   the world follows it far too literally, then Mr. Not Fair notices what he missed. */

const W = 1600, H = 900, INK = '#2b2220';
const FONT = '"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const iw = innerWidth, ih = innerHeight;
  scale = Math.min(iw / W, ih / H);
  offX = (iw - W * scale) / 2; offY = (ih - H * scale) / 2;
  cv.width = Math.round(iw * dpr); cv.height = Math.round(ih * dpr);
  cv.style.width = iw + 'px'; cv.style.height = ih + 'px';
  document.getElementById('rot').style.display = (ih > iw * 1.15 && iw < 900) ? 'flex' : 'none';
}
addEventListener('resize', resize); resize();

// ---------- maths
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const back = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hs(n) { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }

// ---------- hand-drawn primitives (lines "boil" at 8 fps like drawn animation)
let boil = 0, sc = 0, T = 0;
function h(n) { const s = Math.sin(n * 12.9898 + boil * 78.233) * 43758.5453; return s - Math.floor(s); }
function jp(pts, amp) {
  const k = (++sc) * 7.31; if (amp === undefined) amp = 1.7;
  return pts.map((p, i) => [p[0] + (h(k + i * 3.17) * 2 - 1) * amp, p[1] + (h(k + i * 5.91 + 0.37) * 2 - 1) * amp]);
}
function tracePts(p, closed) {
  const n = p.length;
  if (closed) {
    ctx.moveTo((p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2);
    for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < n - 1; i++) { const a = p[i], b = p[i + 1]; ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
    ctx.lineTo(p[n - 1][0], p[n - 1][1]);
  }
}
function blob(pts, fill, lw, stroke) {
  ctx.beginPath(); tracePts(jp(pts), true);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw !== 0) { ctx.lineJoin = 'round'; ctx.lineWidth = lw || 5; ctx.strokeStyle = stroke || INK; ctx.stroke(); }
}
function line(pts, lw, col) {
  ctx.beginPath(); tracePts(jp(pts, 1.2), false);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = lw || 5; ctx.strokeStyle = col || INK; ctx.stroke();
}
function tube(pts, w, col, lw) { // outlined thick stroke, e.g. a sleeve
  const p = jp(pts, 1.2); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); tracePts(p, false); ctx.strokeStyle = INK; ctx.lineWidth = w + (lw || 9); ctx.stroke();
  ctx.beginPath(); tracePts(p, false); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function circPts(x, y, rx, ry, n) {
  ry = ry || rx; n = n || Math.max(10, Math.min(40, Math.round(rx / 3)));
  const a = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; a.push([x + Math.cos(t) * rx, y + Math.sin(t) * ry]); } return a;
}
function polyPts(c, r) {
  const pts = [];
  for (let i = 0; i < c.length; i++) {
    const a = c[i], b = c[(i + 1) % c.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const rr = Math.max(1, Math.min(r, L / 2 - 1)), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    pts.push(a);
    const n = Math.max(1, Math.round((L - 2 * rr) / 70));
    for (let k = 0; k <= n; k++) { const d = rr + (L - 2 * rr) * k / n; pts.push([a[0] + ux * d, a[1] + uy * d]); }
  }
  return pts;
}
function rectPts(x, y, w, hh, r) { return polyPts([[x, y], [x + w, y], [x + w, y + hh], [x, y + hh]], r || 8); }
function dot(x, y, r, c) { ctx.fillStyle = c || INK; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function star(x, y, r, col) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  ctx.beginPath(); tracePts(jp(p, 1), true); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
}

// crayon grain laid over every frame
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
(() => {
  const g = grain.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, l = 3 + Math.random() * 10;
    g.strokeStyle = 'rgba(95,65,40,' + (Math.random() * 0.2).toFixed(3) + ')'; g.lineWidth = 0.6 + Math.random() * 1.3;
    for (const [ox, oy] of [[0, 0], [-256, 0], [0, -256], [256, 0], [0, 256]]) { g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + l * 0.8, y + oy - l * 0.5); g.stroke(); }
  }
})();
const grainPat = ctx.createPattern(grain, 'repeat');

// ---------- audio (all synthesised)
let AC = null, master, musicBus, sfxBus, noiseBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(AC.destination);
    musicBus = AC.createGain(); musicBus.gain.value = 0.2; musicBus.connect(master);
    sfxBus = AC.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
  try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
}
function tone(f, t, d, type, vol, dest, f2) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || sfxBus); o.start(t); o.stop(t + d + 0.05);
}
function noise(t, d, vol, freq, q, type, dest, f2) {
  if (!AC) return;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq || 1000, t); f.Q.value = q || 1;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(dest || sfxBus); s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05);
}
const now = () => AC ? AC.currentTime : 0;
let lastPop = 0;
const sfx = {
  pop() { if (T - lastPop < 0.05) return; lastPop = T; tone(500 + Math.random() * 300, now(), 0.12, 'sine', 0.35, null, 1200); },
  crunch() { const t = now(); for (let i = 0; i < 3; i++) noise(t + i * 0.045, 0.07, 0.5, 1600 + Math.random() * 1600, 1.5); },
  stamp() { const t = now(); tone(150, t, 0.3, 'sine', 0.9, null, 45); noise(t, 0.18, 0.7, 400, 0.8, 'lowpass'); },
  squeak() { tone(900, now(), 0.18, 'square', 0.1, null, 1700); },
  woof() { const t = now(); [0, 0.2].forEach(o => { tone(320, t + o, 0.16, 'sawtooth', 0.22, null, 130); noise(t + o, 0.1, 0.25, 700, 2); }); },
  bubble() { const t = now(); [0, 0.1, 0.18].forEach((o, i) => tone(380 + i * 120, t + o, 0.09, 'sine', 0.3, null, 900 + i * 200)); },
  whoosh() { noise(now(), 0.35, 0.4, 400, 0.8, 'bandpass', null, 3000); },
  sparkle() { const t = now(); [1318, 1568, 1976, 2637].forEach((f, i) => tone(f, t + i * 0.06, 0.35, 'triangle', 0.13)); },
  boing(p) { p = p || 1; tone(160 * p, now(), 0.38, 'sine', 0.5, null, 520 * p); },
  giggle() { const t = now(); for (let i = 0; i < 4; i++) tone(700 + i * 70 + Math.random() * 50, t + i * 0.08, 0.07, 'sine', 0.2, null, 950); },
  bonk() { const t = now(); tone(240, t, 0.3, 'square', 0.18, null, 80); noise(t, 0.1, 0.4, 900, 1); },
  tick() { tone(1100, now(), 0.05, 'square', 0.07); },
  tweet() { const t = now(); tone(2400, t, 0.08, 'sine', 0.2, null, 3200); tone(2600, t + 0.1, 0.08, 'sine', 0.2, null, 3400); },
  crash() { const t = now(); noise(t, 0.6, 0.8, 1200, 0.5, 'lowpass', null, 200); tone(90, t, 0.5, 'sawtooth', 0.35, null, 40); },
  scratch() { const t = now(); noise(t, 0.35, 0.6, 3000, 2, 'bandpass', null, 300); },
  scribble() { const t = now(); for (let i = 0; i < 10; i++) noise(t + i * 0.07, 0.06, 0.25, 2500 + Math.random() * 2000, 3); },
  gulp() { const t = now(); tone(300, t, 0.15, 'sine', 0.5, null, 90); },
};
let rum = null;
function rumble(v) {
  if (!AC) return;
  if (!rum) {
    const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 350; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(sfxBus); o.start(); rum = { o, g };
  }
  rum.g.gain.setTargetAtTime(v * 0.35, AC.currentTime, 0.03);
  rum.o.frequency.setTargetAtTime(50 + v * 120, AC.currentTime, 0.05);
}
function stopRumble() {
  if (!rum) return; const r = rum; rum = null;
  r.g.gain.setTargetAtTime(0, AC.currentTime, 0.05); setTimeout(() => { try { r.o.stop(); } catch (e) {} }, 400);
}

// music: a tiny step sequencer whose mood follows the story
let mMode = 'off', mStep = 0, mNext = 0, mInt = 0;
const MEL = [72, 0, 76, 0, 79, 0, 76, 0, 77, 0, 81, 0, 77, 0, 72, 0, 74, 0, 79, 0, 83, 0, 79, 81, 79, 76, 72, 0, 72, 0, 0, 0];
const CH = [48, 53, 55, 48];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function music(m) { mMode = m; mStep = 0; if (AC) mNext = AC.currentTime + 0.05; }
function mt(n, t, d, type, vol) { tone(midi(n), t, d, type, vol, musicBus); }
function playStep(s, t, sd) {
  const i = s % 32, bar = Math.floor(i / 8);
  if (mMode === 'calm') {
    if (MEL[i]) mt(MEL[i], t, sd * 1.6, 'triangle', 0.5);
    if (i % 4 === 0) mt(CH[bar], t, sd * 3, 'sine', 0.7);
    if (i % 8 === 4) mt(CH[bar] + 7, t, sd * 2, 'sine', 0.35);
  } else if (mMode === 'tense') {
    if (i % 4 === 0) tone(58, t, 0.3, 'sine', 0.9, musicBus, 40);
    if (i % 8 === 6) tone(58, t, 0.25, 'sine', 0.6, musicBus, 40);
    if (i % 16 === 0) mt(61, t, sd * 6, 'triangle', 0.22);
    if (i % 16 === 8) mt(60, t, sd * 6, 'triangle', 0.22);
  } else if (mMode === 'chaos') {
    const n = MEL[i];
    if (n) { mt(n, t, sd * 1.2, 'square', 0.16 + 0.12 * mInt); if (mInt > 0.4) mt(n + 12, t, sd * 0.8, 'triangle', 0.2 * mInt); }
    if (i % 4 === 0) { tone(120, t, 0.18, 'sine', 0.9, musicBus, 45); mt(CH[bar] - 12, t, sd * 2, 'sawtooth', 0.16); }
    if (i % 8 === 4) noise(t, 0.12, 0.35, 1800, 0.8, 'bandpass', musicBus);
    if (mInt > 0.2) noise(t, 0.04, 0.1 + 0.12 * mInt, 7000, 1, 'highpass', musicBus);
  } else if (mMode === 'quiet') {
    if (i % 16 === 0) [60, 64, 67].forEach(n => tone(midi(n), t, sd * 14, 'sine', 0.16, musicBus));
    if (i % 16 === 10) mt(79, t, sd * 4, 'sine', 0.18);
  }
}
setInterval(() => {
  if (!AC || mMode === 'off') return;
  const bpm = mMode === 'chaos' ? 118 + mInt * 60 : mMode === 'quiet' ? 80 : mMode === 'tense' ? 92 : 108;
  const sd = 60 / bpm / 2;
  if (mNext < AC.currentTime) mNext = AC.currentTime + 0.02;
  while (mNext < AC.currentTime + 0.12) { playStep(mStep++, mNext, sd); mNext += sd; }
}, 30);

// speech (stand-in for recorded voice acting)
let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voice = vs.find(v => /en-GB/i.test(v.lang)) || vs.find(v => /en-AU/i.test(v.lang)) || vs[0] || null;
  } catch (e) {}
}
try { if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch (e) {}
function say(text, o) {
  if (muted) return;
  try {
    if (!window.speechSynthesis) return; o = o || {};
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = o.pitch || 1.4; u.rate = o.rate || 1; u.volume = o.vol === undefined ? 1 : o.vol;
    if (voice) u.voice = voice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- world state
const PL = { boy: 470, mnf: 800, girl: 1130 }; // plate x positions
const PLY = 652;
const SHIRT = { mnf: '#f6b820', girl: '#9a74d6', boy: '#5aab4d' };
const SKIN = { mnf: '#f4b98f', girl: '#b97a4e', boy: '#e8ad86' };
const POSE = {
  rest: { L: [-85, -12], R: [85, -12] },
  up: { L: [-165, -300], R: [165, -300] },
  chin: { L: [-85, -12], R: [20, -168] },
  offerR: { L: [-85, -12], R: [205, -110] },
  self: { L: [-85, -12], R: [8, -95] },
  cheer: { L: [-150, -260], R: [150, -260] },
  reachTin: { L: [-160, -30], R: [85, -12] },
  reachL: { L: [-170, -70], R: [85, -12] },
  holdUpL: { L: [-110, -235], R: [85, -12] },
};
function mkKid(kind, x) {
  return { kind, x, tx: x, y: 600, s: 1, ts: 1, expr: 'neutral', look: 0, tlook: 0, hands: { L: [-85, -12], R: [85, -12] }, th: { L: [-85, -12], R: [85, -12] }, hop: 0, shake: 0, talk: 0, puff: 0, tpuff: 0, red: 0, bub: 0, bubble: 0, glow: 0 };
}
function pose(k, p) { if (typeof p === 'string') p = POSE[p]; k.th = { L: p.L.slice(), R: p.R.slice() }; }
function handWorld(k, side) { return { x: k.x + k.hands[side][0] * k.s, y: k.y + k.hands[side][1] * k.s }; }

let kids = {}, biscuits = [], fx = [], teddy, dog, bird, fish, ants = [], tower = null;
const tin = { x: 635, tx: 635, y: 672, open: false, lidP: 0, shake: 0 };
const arm = { p: 0, tp: 0 };
const hmF = new Float32Array(40), hmT = new Float32Array(40);
const cam = { x: 800, y: 450, z: 1, tx: 800, ty: 450, tz: 1 };
let shake = 0, desat = 0, tdesat = 0, wipe = null, pinShown = false;
let bid = 0;
const S = { phase: 'title', pt: 0, idle: 0, gen: 0, rule: { who: null, what: null } };
let timers = [];
function later(d, fn) { timers.push({ t: d, fn, gen: S.gen }); }

function resetActors() {
  teddy = { x: 165, y: 405, state: 'shelf', bounce: 0, t: 0 };
  dog = { x: 1470, y: 872, state: 'sleep', dir: -1, tx: 1470, chew: 0, t: 0, sx: 0, sy: 0, ex: 0, ey: 0, then: null };
  bird = { x: 1700, y: 60, state: 'away', t: 0 };
  fish = { x: 1340, y: 604, excite: 0 };
  ants = [];
}
function mkB(x, y, r, chips) {
  return { id: ++bid, x, y, r, tr: r, chips: chips === undefined ? Math.round(r / 10) : chips, mode: 'rest', vx: 0, vy: 0, flat: 0, tflat: 0, rot: 0, spin: 0, layer: 'table', owner: null, place: null, ox: 0, oy: 0 };
}
function flyB(b, tx, ty, dur, arc, after) { b.mode = 'fly'; b.sx = b.x; b.sy = b.y; b.fx = tx; b.fy = ty; b.ft = 0; b.fd = dur; b.arc = arc || 0; b.after = after || null; }

function resetScene(mode) {
  biscuits = []; fx = []; hmF.fill(0); hmT.fill(0); tower = null; pinShown = false;
  kids = { boy: mkKid('boy', PL.boy), mnf: mkKid('mnf', PL.mnf), girl: mkKid('girl', PL.girl) };
  tin.x = tin.tx = 635; tin.shake = 0;
  if (mode === 'fresh') { resetActors(); tin.open = false; tin.lidP = 0; arm.p = arm.tp = 0; return; }
  tin.open = true; tin.lidP = 1; ants = []; arm.p = arm.tp = 0;
  if (teddy.state === 'jump') { teddy.state = 'table'; teddy.x = 215; teddy.y = 668; }
  if (dog.state === 'walk' || dog.state === 'leap') { dog.state = 'sit'; dog.x = dog.tx = 1190; }
  if (bird.state === 'fly') { bird.state = 'sit'; bird.x = 1290; bird.y = 358; }
  const add = (o, r, c) => { const b = mkB(PL[o], PLY, r, c); b.owner = o; b.place = 'flat'; b.flat = b.tflat = 1; biscuits.push(b); return b; };
  add('boy', 70, 7); add('girl', 40, 0); add('mnf', 13, 1);
  for (let i = 0; i < 7; i++) { const c = mkB(260 + hs(i + 3) * 1060, 690 + hs(i + 9) * 50, 2.5 + hs(i) * 2.5, 0); biscuits.push(c); }
}

function anchor(n) {
  if (!n) return null;
  if (PL[n] !== undefined) return { x: PL[n], y: PLY };
  if (n.startsWith('hand:')) { const [, k, s] = n.split(':'); return handWorld(kids[k], s); }
  switch (n) {
    case 'teddy': return { x: teddy.x + 45, y: teddy.y - 20 };
    case 'fish': return { x: fish.x, y: fish.y + 30 };
    case 'dog': return { x: dog.x + dog.dir * 72, y: dog.y - 100 };
    case 'bird': return { x: bird.x + 34, y: bird.y - 6 };
    case 'halo': return { x: 800, y: 600 - 150 * kids.mnf.s };
  }
  if (n.startsWith('ant')) { const a = ants[+n.slice(3)]; return a ? { x: a.x, y: a.y - 12 } : { x: 100, y: 880 }; }
  return null;
}

// ---------- drawing: characters
function face(k, ey) {
  const e = k.expr, lx = k.look * 8, ew = 28;
  if (e === 'joy') {
    line([[-ew - 10 + lx, ey + 3], [-ew + lx, ey - 7], [-ew + 10 + lx, ey + 3]], 5);
    line([[ew - 10 + lx, ey + 3], [ew + lx, ey - 7], [ew + 10 + lx, ey + 3]], 5);
  } else {
    const r = (e === 'shock' || e === 'notice') ? 9 : 7;
    dot(-ew + lx, ey, r); dot(ew + lx, ey, r);
  }

  arm.p += (arm.tp - arm.p) * Math.min(1, dt * 6);

    k.bub += (k.bubble - k.bub) * Math.min(1, dt * 6);

  const ph = S.phase;
  if (ph === 'title') drawTitle();
  else if (ph === 'end') drawEnd();
  else {
    const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
    const camT = () => { ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y); };
    ctx.save(); camT(); drawWorld(); ctx.restore();
    if (desat > 0.02) {
      ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(128,128,128,' + desat + ')'; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(215,205,195,' + desat + ')'; ctx.fillRect(0, 0, W, H); ctx.restore();
      if (ph === 'unfair' || ph === 'deal') { // keep the feeling in colour: him and the biscuits
        ctx.save(); camT();
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 596); ctx.clip(); drawKid(kids.mnf); ctx.restore();
        drawPlate(PL.boy); drawPlate(PL.mnf); drawPlate(PL.girl);
        for (const b of biscuits) if (b.owner) drawBiscuit(b);
        drawFx(); ctx.restore();
      }
    }
    phaseUI();
  }
  drawWipe();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05); vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(150,110,70,0.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); ctx.restore();
  // sound toggle
  ctx.save(); ctx.translate(1540, 60); blob(circPts(0, 0, 38, 38), '#fffdf6', 5);
  blob(polyPts([[-20, -8], [-8, -8], [8, -22], [8, 22], [-8, 8], [-20, 8]], 3), INK, 0);
  if (muted) { line([[16, -12], [32, 12]], 5, '#e0412f'); line([[32, -12], [16, 12]], 5, '#e0412f'); }
  else { ctx.beginPath(); ctx.arc(10, 0, 14, -0.8, 0.8); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke(); ctx.beginPath(); ctx.arc(10, 0, 24, -0.8, 0.8); ctx.stroke(); }
  ctx.restore();
  ctx.restore();
}
function phaseUI() {
  const ph = S.phase;
  if (ph === 'start' && S.idle > 1.2) { const p = w2s(tin.x, tin.y - 40); drawHint(p.x + 10, p.y + 30, 'up'); }
  if (ph === 'unfair') {
    if (S.burst < 0) {
      const p = S.holding ? 0.94 : 1 + Math.sin(T * 5) * 0.05;
      ctx.save(); ctx.translate(800, 780); ctx.scale(p, p);
      blob(circPts(0, 0, 98, 98), '#fffdf6', 6);
      ctx.beginPath(); ctx.arc(0, 0, 84, -Math.PI / 2, -Math.PI / 2 + S.meter * 6.2832); ctx.lineWidth = 22; ctx.strokeStyle = '#e0412f'; ctx.lineCap = 'round'; if (S.meter > 0.01) ctx.stroke();
      blob(circPts(0, 0, 62, 62), '#f6b820', 4);
      ctx.save(); ctx.scale(1.15, 1.15); miniFace('mnf', 0, 6, 1);
      line([[-24, -8], [-6, -2]], 4); line([[24, -8], [6, -2]], 4);
      ctx.restore();
      ctx.restore();
      if (S.idle > 1.0 && !S.holding && S.meter < 0.2) drawHint(800, 670, 'down');
    }
    drawBurst(120, 130);
  }
  if (ph === 'joke') drawBurst(96, 110);
  if (ph === 'rule') {
    const u = S.stampT > 0.6 ? ease((S.stampT - 0.6) / 0.6) : 0;
    ctx.fillStyle = 'rgba(40,28,20,' + (0.35 * (1 - u)) + ')'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(0, (1 - ease(S.pt / 0.5)) * -500);
    ctx.translate(lerp(0, -115, u), lerp(0, -35, u)); ctx.scale(lerp(1, 0.38, u), lerp(1, 0.38, u));
    drawBoard(true); ctx.restore();
    ctx.save(); ctx.translate(0, u * 500);
    blob(rectPts(170, 490, 460, 244, 24), '#e8dcf3', 5); blob(rectPts(760, 490, 700, 244, 24), '#fbe2c2', 5);
    for (const c of cards) if (!c.inSlot) drawCard(c);
    ctx.restore();
    if (S.stampT < 0 && S.idle > 1.5) {
      if (!S.rule.who) drawHint(300, 690, 'up');
      else if (!S.rule.what) drawHint(1110, 690, 'up');
      else drawHint(1180, 345, 'up');
    }
  }
  if (ph === 'chaos' || ph === 'freeze') {
    if (pinShown) { ctx.save(); ctx.translate(-115, -35); ctx.scale(0.38, 0.38); drawBoard(false); ctx.restore(); }
  }
  if (ph === 'notice' && !S.noticed && S.idle > 1.5) { const p = w2s(kids.girl.x - 70, kids.girl.y - 170); drawHint(p.x - 90, p.y, 'up'); }
  if (ph === 'repair' && S.choice < 0) {
    CHOICES.forEach((c, i) => {
      const u = back((S.pt - i * 0.12) / 0.4); if (u <= 0) return;
      ctx.save(); ctx.translate(c.x, 790 + Math.sin(T * 3 + i) * 5); ctx.scale(u, u);
      blob(circPts(0, 0, 86, 86), '#fffdf6', 6); icon(c.id, 0, 4, 0.95);
      ctx.restore();
    });
    if (S.idle > 2.5) drawHint(800, 690, 'down');
  }
}

// ---------- input
let holdingKey = false;
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
function toWorld(p) { return { x: (p.x - W / 2) / cam.z + cam.x, y: (p.y - H / 2) / cam.z + cam.y }; }
function pokeToys(w) {
  const d = (x, y) => Math.hypot(w.x - x, w.y - y);
  if (d(teddy.x, teddy.y - 70) < 70) { teddy.bounce = 1; sfx.squeak(); return true; }
  if (d(fish.x, fish.y) < 60) { fish.excite = 1; sfx.bubble(); return true; }
  if (d(dog.x, dog.y - 60) < 90) { if (dog.state === 'sleep') dog.state = 'sit'; sfx.woof(); return true; }
  if (bird.state === 'sit' && d(bird.x, bird.y - 25) < 45) { sfx.tweet(); return true; }
  for (const k of Object.values(kids)) {
    if (d(k.x, k.y - 230 * k.s) < 85 * k.s) { k.hop = 1; if (k.kind === 'mnf') sfx.boing(1.6); else sfx.giggle(); return true; }
  }
  return false;
}
function down(p) {
  S.idle = 0;
  if (Math.hypot(p.x - 1540, p.y - 60) < 46) {
    muted = !muted; if (master) master.gain.value = muted ? 0 : 0.7;
    try { if (muted && window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
    return;
  }
  if (wipe) return;
  const ph = S.phase, w = toWorld(p);
  if (ph === 'title') { sfx.pop(); startWipe(() => { resetScene('fresh'); setPhase('start'); }); return; }
  if (ph === 'end') {
    if (Math.hypot(p.x - 1420, p.y - 760) < 100) { sfx.pop(); startWipe(() => { resetScene('fresh'); setPhase('start'); }); }
    return;
  }
  if (ph === 'start') {
    if (Math.hypot(w.x - tin.x, w.y - (tin.y - 40)) < 95) { setPhase('deal'); return; }
    pokeToys(w); return;
  }
  if (ph === 'unfair') { if (S.burst < 0) { S.holding = true; S.meter = Math.min(1, S.meter + 0.08); } return; }
  if (ph === 'rule') {
    if (S.stampT >= 0 || S.pt < 0.4) return;
    if (S.rule.who && S.rule.what && Math.hypot(p.x - 1180, p.y - 255) < 90) {
      S.stampT = 0; sfx.stamp(); shake = 10;
      const key = S.rule.who + '-' + S.rule.what; say(SENT[key], { pitch: 1.5 });
      kids.mnf.talk = 1.6; kids.mnf.expr = 'happy'; pose(kids.mnf, 'self');
      return;
    }
    for (const c of cards.slice().sort((a, b) => b.inSlot - a.inSlot)) {
      if (Math.abs(p.x - c.x) < 88 && Math.abs(p.y - c.y) < 98) {
        if (c.inSlot) { c.inSlot = false; S.rule[c.slot] = null; sfx.pop(); return; }
        cards.forEach(o => { if (o.inSlot && o.slot === c.slot) o.inSlot = false; });
        c.inSlot = true; c.sc = 1.2; S.rule[c.slot] = c.id; sfx.pop(); say(c.say, { pitch: 1.5 }); kids.mnf.talk = 0.8;
        return;
      }
    }
    return;
  }
  if (ph === 'chaos') {
    const b = biscuits.find(b => Math.hypot(w.x - b.x, w.y - b.y) < b.r + 12 && b.r < 200);
    if (b) { sfx.crunch(); burstCrumbs(b.x, b.y, 6); if (b.mode === 'pile' || b.mode === 'rest') { b.oy = 0; } return; }
    pokeToys(w); return;
  }
  if (ph === 'notice') {
    const g = kids.girl;
    if (!S.noticed && Math.hypot(w.x - g.x, w.y - (g.y - 160)) < 150) { notice(); return; }
    pokeToys(w); return;
  }
  if (ph === 'repair') {
    if (S.choice >= 0) { pokeToys(w); return; }
    CHOICES.forEach((c, i) => { if (S.choice < 0 && Math.hypot(p.x - c.x, p.y - 790) < 92) doRepair(i); });
    return;
  }
  pokeToys(w);
}
function up() { if (S.phase === 'unfair' && !holdingKey) S.holding = false; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); down(toLogical(e)); });
addEventListener('pointerup', up); addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { initAudio(); if (S.phase === 'unfair') { holdingKey = true; S.holding = true; S.idle = 0; } else if (S.phase === 'title') down({ x: 1160, y: 640 }); }
  if (e.code === 'KeyM') down({ x: 1540, y: 60 });
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') { holdingKey = false; up(); } });

// ---------- go
resetScene('fresh');
let last = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; T += dt;
  boil = Math.floor(T * 8) % 3;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// debug hooks for automated playtesting
window.__mnf = { S, kids, get biscuits() { return biscuits; }, setPhase, resetScene, down, up, notice, doRepair };
</script>
